plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.google.devtools.ksp'
}
architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modCompileOnly "me.ddayo:aris:1.1.0-SNAPSHOT"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    ksp "me.ddayo:ap:1.0-SNAPSHOT"
    implementation "me.ddayo:aris.luagen:1.0-SNAPSHOT"
    implementation "party.iroiro.luajava:luajit:4.0.0"

    implementation "redis.clients:jedis:7.2.0"
    implementation "org.mongodb:mongodb-driver-sync:5.2.1"
}
repositories {
    mavenCentral()
}
kotlin {
    jvmToolchain(21)
}

processResources {
    inputs.property 'mod_package', project.group
    inputs.property 'mod_id', project.modId

    filesMatching("${project.modId}.mixins.json") {
        expand(
                mod_id: project.modId,
                mod_package: project.group
        )
    }
}

// --- Auto-Generated Settings ---
ksp {
    arg("package_name", "me.ddayo.arisdb.lua.glue")
    arg("export_doc", "true")
    arg("export_api_schema", "true")
    arg("api_display_lang", "en|kr")
    arg("api_contexts.ArisdbInitProviderGenerated", "init-mc")
    arg("api_contexts.ArisdbInGameProviderGenerated", "game-mc")
    arg("api_contexts.ArisdbClientMainProviderGenerated", "client-mc")
    arg("api_contexts.ArisdbClientInitProviderGenerated", "client-init-mc")
    arg("api_contexts.ArisdbClientInGameProviderGenerated", "client-game-mc")
}
