plugins {
    id 'com.github.johnrengelman.shadow'
    id 'org.jetbrains.kotlin.jvm'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    mavenCentral()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
    modImplementation files(rootProject.file('aris-mc/neoforge/build/libs/aris-1.1.0.jar'))
    implementation 'thedarkcolour:kotlinforforge-neoforge:5.11.0'

    // DB drivers must be bundled here too — `include` is non-transitive, so list every dep.
    include "redis.clients:jedis:7.2.0"
    include "org.apache.commons:commons-pool2:2.12.1"
    include "org.json:json:20250517"
    include "redis.clients.authentication:redis-authx-core:0.1.1-beta2"
    include "org.mongodb:mongodb-driver-sync:5.2.1"
    include "org.mongodb:mongodb-driver-core:5.2.1"
    include "org.mongodb:bson:5.2.1"
    include "org.mongodb:bson-record-codec:5.2.1"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', project.modId
    inputs.property 'mod_name', project.modName
    inputs.property 'mod_description', project.modDescription
    inputs.property 'mod_authors', project.modAuthors

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                version: project.version,
                mod_id: project.modId,
                mod_name: project.modName,
                mod_description: project.modDescription,
                mod_authors: project.modAuthors,
        )
    }
    filesMatching('pack.mcmeta') {
        expand(
                version: project.version,
                mod_id: project.modId,
                mod_name: project.modName,
                mod_description: project.modDescription,
                mod_authors: project.modAuthors,
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
kotlin {
    jvmToolchain(21)
}
