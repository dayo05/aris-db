# Build recipe consumed by https://github.com/dayo05/kei after each push.
# The server-side kei.toml only knows the repo URL + secrets; everything
# below — steps, artifact globs, nix overrides — is loaded from this file.

# aris-db consumes aris-mc + aris.luagen + ap from the kei Maven repo
# (https://kei.ddayo.me/maven) via SNAPSHOT coordinates, so no
# composite/submodule build needed here.
# `--refresh-dependencies` makes gradle re-check maven-metadata for the
# SNAPSHOT deps from kei.ddayo.me/maven on every build. Without it,
# gradle's default 24h SNAPSHOT cache window means a freshly-published
# aris/aris.luagen update isn't visible to back-to-back kei builds.
[[steps]]
name = "build"
command = "./gradlew"
args = ["build", "--refresh-dependencies"]

# Publishes me.ddayo:aris-db-<loader> into the kei-managed Maven repo
# as BOTH `<version>` (immutable — pinning) and `<version>-SNAPSHOT`
# (mutable — gradle auto-refreshes downstream builds). Skipped when the
# version already ends in -SNAPSHOT.
[[steps]]
name = "publish-maven"
command = "bash"
args = [
  "-c",
  """
set -euo pipefail
TARGET="${KEI_MAVEN_REPO:-$HOME/.m2/repository}"
VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
./gradlew publishToMavenLocal -Dmaven.repo.local="$TARGET"
case "$VERSION" in
  *-SNAPSHOT) echo "version $VERSION is already a SNAPSHOT; skipping second publish" ;;
  *) ./gradlew publishToMavenLocal "-Pmod_version=${VERSION}-SNAPSHOT" -Dmaven.repo.local="$TARGET" ;;
esac
""",
]

[[steps]]
name = "update-docs"
command = "bash"
args = [
  "-c",
  """
set -euo pipefail
SOURCE_DIR=common/build/generated/ksp/main/resources
DEST_DIR=docs
if [ ! -d "$SOURCE_DIR" ]; then
  echo "source not found: $SOURCE_DIR" >&2
  exit 1
fi
mkdir -p "$DEST_DIR"
rm -rf "$DEST_DIR"/*
cp -r "$SOURCE_DIR"/* "$DEST_DIR"/
git add docs/
if git diff --staged --quiet; then
  echo "docs unchanged, skipping push"
else
  git -c user.name="kei-bot" -c user.email="self@ddayo.me" \\
      commit -m "chore: update documentation [skip ci]"
  git push origin HEAD:master
fi
"""
]

# Filenames already encode the loader (aris-db-fabric-<version>.jar etc.),
# so `suffix = ""` flattens to the artifact root without renaming. The `*`
# pulls in main + dev-shadow + sources.
[[artifacts]]
pattern = "fabric/build/libs/aris-*.jar"
suffix = ""

[[artifacts]]
pattern = "neoforge/build/libs/aris-*.jar"
suffix = ""