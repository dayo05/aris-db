# Build recipe consumed by https://github.com/dayo05/kei after each push.
# The server-side kei.toml only knows the repo URL + secrets; everything
# below — steps, artifact globs, nix overrides — is loaded from this file.

# aris-db's subprojects depend on a pre-built aris-mc jar at
# aris-mc/<loader>/build/libs/aris-<version>.jar (referenced via
# `modImplementation files(...)`). aris-mc is a git submodule, so kei
# builds it first inside its own directory (loom can't handle the
# submodule via composite-build task paths), then builds aris-db from
# the root.
[[steps]]
name = "build-aris-mc"
command = "./gradlew"
args = ["build"]
cwd = "aris-mc"

[[steps]]
name = "build"
command = "./gradlew"
args = ["build"]

[[steps]]
name = "update-docs"
command = "bash"
args = [
  "-c",
  """
set -euo pipefail
SOURCE_DIR=common/build/generated/ksp/main/resources
DEST_DIR=docs
if [ ! -d "$SOURCE_DIR" ]; then
  echo "source not found: $SOURCE_DIR" >&2
  exit 1
fi
mkdir -p "$DEST_DIR"
rm -rf "$DEST_DIR"/*
cp -r "$SOURCE_DIR"/* "$DEST_DIR"/
git add docs/
if git diff --staged --quiet; then
  echo "docs unchanged, skipping push"
else
  git -c user.name="kei-bot" -c user.email="self@ddayo.me" \\
      commit -m "chore: update documentation [skip ci]"
  git push origin HEAD:master
fi
"""
]

# Filenames already encode the loader (aris-db-fabric-<version>.jar etc.),
# so `suffix = ""` flattens to the artifact root without renaming. The `*`
# pulls in main + dev-shadow + sources.
[[artifacts]]
pattern = "fabric/build/libs/aris-*.jar"
suffix = ""

[[artifacts]]
pattern = "neoforge/build/libs/aris-*.jar"
suffix = ""